<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>withDOG Map</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    #map { width: 100%; height: 100vh; background: #ffffff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey={{KAKAO_KEY}}&libraries=services,clusterer"></script>
  <script>
    let map = null;
    let markers = [];
    let currentLocationMarker = null;
    let routePolyline = null;
    let routeOutlinePolyline = null;
    let routeShadowPolyline = null;
    let routeStartMarker = null;
    let routeEndMarker = null;

    function callDart(name, payload) {
      try {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler(name, payload);
        }
      } catch (e) { console.error('callDart err', e); }
    }

    function initMap() {
      const seoul = new kakao.maps.LatLng(37.5665, 126.9780);
      map = new kakao.maps.Map(document.getElementById('map'), {
        center: seoul,
        level: 5,
      });
      kakao.maps.event.addListener(map, 'idle', () => {
        const c = map.getCenter();
        callDart('onMapMoved', { lat: c.getLat(), lng: c.getLng(), level: map.getLevel() });
      });
      callDart('onMapReady', { lat: 37.5665, lng: 126.9780 });
    }

    /** SVG 문자열 → data:image URI 변환 */
    function _svgToDataUri(svg) {
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    /** 장소 마커 SVG — 주황 핀 + 흰 원 + 발바닥 */
    function _placeMarkerSvg() {
      return '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="46" viewBox="0 0 36 46">'
        + '<path d="M18 0C8.059 0 0 8.059 0 18c0 13.5 18 28 18 28s18-14.5 18-28C36 8.059 27.941 0 18 0z" fill="#FF7A4D" stroke="#fff" stroke-width="2"/>'
        + '<circle cx="18" cy="16.5" r="10.5" fill="#fff"/>'
        + '<g fill="#FF7A4D">'
        +   '<ellipse cx="18" cy="19.5" rx="4" ry="3.2"/>'
        +   '<circle cx="12.5" cy="13.5" r="2"/>'
        +   '<circle cx="15.5" cy="10.8" r="2"/>'
        +   '<circle cx="20.5" cy="10.8" r="2"/>'
        +   '<circle cx="23.5" cy="13.5" r="2"/>'
        + '</g>'
        + '</svg>';
    }

    /** 현재 위치 마커 SVG — 파란 원 + 흰 테두리 + 중심 점 + 글로우 */
    function _currentLocationSvg() {
      return '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">'
        + '<circle cx="14" cy="14" r="13" fill="#4285F4" fill-opacity="0.15" stroke="none"/>'
        + '<circle cx="14" cy="14" r="9" fill="#4285F4" stroke="#fff" stroke-width="3"/>'
        + '<circle cx="14" cy="14" r="3" fill="#fff"/>'
        + '</svg>';
    }

    /** Dart → JS: 마커 일괄 갱신 */
    function setMarkers(places) {
      // places = [{contentId, name, lat, lng, subCategory}]
      markers.forEach(m => m.setMap(null));
      markers = [];
      if (!places || places.length === 0) return;

      const placeImg = new kakao.maps.MarkerImage(
        _svgToDataUri(_placeMarkerSvg()),
        new kakao.maps.Size(36, 46),
        { offset: new kakao.maps.Point(18, 46) }
      );

      const bounds = new kakao.maps.LatLngBounds();
      places.forEach(p => {
        const pos = new kakao.maps.LatLng(p.lat, p.lng);
        const marker = new kakao.maps.Marker({ position: pos, map, title: p.name, image: placeImg });
        kakao.maps.event.addListener(marker, 'click', () => {
          callDart('onMarkerTap', {
            contentId: p.contentId,
            name: p.name,
            lat: p.lat,
            lng: p.lng,
          });
        });
        markers.push(marker);
        bounds.extend(pos);
      });
      if (places.length > 1) map.setBounds(bounds);
      else map.setCenter(new kakao.maps.LatLng(places[0].lat, places[0].lng));
    }

    /** Dart → JS: 단일 좌표 포커스 */
    function focusLatLng(lat, lng, level) {
      if (!map) return;
      map.setCenter(new kakao.maps.LatLng(lat, lng));
      if (typeof level === 'number') map.setLevel(level);
    }

    /** Dart → JS: 현재 위치 마커 (GPS) — 파란 원 + 흰 테두리 + 중심 점. setMarkers 와 독립. */
    function setCurrentLocationMarker(lat, lng) {
      if (!map) return;
      const pos = new kakao.maps.LatLng(lat, lng);
      const markerImage = new kakao.maps.MarkerImage(
        _svgToDataUri(_currentLocationSvg()),
        new kakao.maps.Size(28, 28),
        { offset: new kakao.maps.Point(14, 14) }
      );
      if (currentLocationMarker) {
        currentLocationMarker.setPosition(pos);
        currentLocationMarker.setImage(markerImage);
      } else {
        currentLocationMarker = new kakao.maps.Marker({
          position: pos,
          map,
          image: markerImage,
          zIndex: 100,
        });
      }
    }

    /** 마커용 SVG 생성 헬퍼 */
    function _makeCircleSvg(fill, stroke, size) {
      const r = size / 2;
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
        + '<circle cx="'+r+'" cy="'+r+'" r="'+(r-2)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="3"/>'
        + '</svg>';
      return 'data:image/svg+xml;base64,' + btoa(svg);
    }

    function _makePinSvg(fill) {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">'
        + '<path d="M14 0C6.268 0 0 6.268 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.268 21.732 0 14 0z" fill="'+fill+'" stroke="#fff" stroke-width="2"/>'
        + '<circle cx="14" cy="14" r="5" fill="#fff"/>'
        + '</svg>';
      return 'data:image/svg+xml;base64,' + btoa(svg);
    }

    /** Dart → JS: 경로 Polyline 그리기 (shadow + main + 출발/도착 마커) */
    function drawRoutePolyline(points) {
      // points = [{lat, lng}, ...]
      clearRoutePolyline();
      if (!map || !points || points.length < 2) return;
      const path = points.map(p => new kakao.maps.LatLng(p.lat, p.lng));

      // 경로 표시 중에는 장소 마커 숨김 (겹침 방지)
      markers.forEach(m => m.setMap(null));

      // 그림자 (가장 아래 — 부드러운 드롭 섀도우)
      routeShadowPolyline = new kakao.maps.Polyline({
        map: map,
        path: path,
        strokeWeight: 16,
        strokeColor: '#000000',
        strokeOpacity: 0.10,
        strokeStyle: 'solid',
        zIndex: 1,
      });

      // 흰색 아웃라인 (두꺼운 테두리)
      routeOutlinePolyline = new kakao.maps.Polyline({
        map: map,
        path: path,
        strokeWeight: 12,
        strokeColor: '#FFFFFF',
        strokeOpacity: 1,
        strokeStyle: 'solid',
        zIndex: 2,
      });

      // 메인 경로선
      routePolyline = new kakao.maps.Polyline({
        map: map,
        path: path,
        strokeWeight: 6,
        strokeColor: '#FF6B35',
        strokeOpacity: 1,
        strokeStyle: 'solid',
        zIndex: 3,
      });

      // 출발 마커 (파란 원)
      const startPos = path[0];
      const startImg = new kakao.maps.MarkerImage(
        _makeCircleSvg('#4285F4', '#fff', 22),
        new kakao.maps.Size(22, 22),
        { offset: new kakao.maps.Point(11, 11) }
      );
      routeStartMarker = new kakao.maps.Marker({
        position: startPos, map: map, image: startImg, zIndex: 10,
      });

      // 도착 마커 (발바닥 핀 — 장소 마커와 동일)
      const endPos = path[path.length - 1];
      const endImg = new kakao.maps.MarkerImage(
        _svgToDataUri(_placeMarkerSvg()),
        new kakao.maps.Size(36, 46),
        { offset: new kakao.maps.Point(18, 46) }
      );
      routeEndMarker = new kakao.maps.Marker({
        position: endPos, map: map, image: endImg, zIndex: 10,
      });

      // 경로에 맞게 지도 범위 조정
      const bounds = new kakao.maps.LatLngBounds();
      path.forEach(p => bounds.extend(p));
      map.setBounds(bounds);
    }

    /** Dart → JS: 경로 Polyline + 마커 제거 */
    function clearRoutePolyline() {
      if (routeShadowPolyline) { routeShadowPolyline.setMap(null); routeShadowPolyline = null; }
      if (routeOutlinePolyline) { routeOutlinePolyline.setMap(null); routeOutlinePolyline = null; }
      if (routePolyline) { routePolyline.setMap(null); routePolyline = null; }
      if (routeStartMarker) { routeStartMarker.setMap(null); routeStartMarker = null; }
      if (routeEndMarker) { routeEndMarker.setMap(null); routeEndMarker = null; }
      // 숨겨뒀던 장소 마커 복원
      markers.forEach(m => m.setMap(map));
    }

    // SDK 로드 검증
    if (typeof kakao === 'undefined') {
      callDart('onMapError', { message: 'kakao SDK 로드 실패 (도메인 등록 / API key 확인)' });
    } else {
      kakao.maps.load(initMap);
    }
  </script>
</body>
</html>
