services:

  # ── 백엔드 (FastAPI + uvicorn) ─────────────────────────────────────────────
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    image: withdog-backend:local
    container_name: withdog-backend
    env_file:
      - ../../.env
    volumes:
      - ~/.ssh/withDOG.pem:/run/secrets/withdog.pem:ro
      - ../../data/chroma_db:/app/data/chroma_db:ro
    # 직접 디버깅이 필요할 때 아래 주석을 해제
    # ports:
    #   - "8000:8000"
    restart: unless-stopped
    networks:
      - withdog-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── Nginx (정적 파일 서빙 + API 리버스 프록시) ─────────────────────────────
  nginx:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.nginx
    image: withdog-nginx:local
    container_name: withdog-nginx
    ports:
      - "80:80"
    volumes:
      # NGINX_CONF 환경변수로 conf 파일 선택 (미설정 시 로컬 개발용 nginx.conf)
      - ../nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - withdog-net

networks:
  withdog-net:
    driver: bridge
