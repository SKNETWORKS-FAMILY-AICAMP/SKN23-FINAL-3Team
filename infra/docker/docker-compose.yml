services:

  # ── 백엔드 (FastAPI + uvicorn) ─────────────────────────────────────────────
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    image: withdog-backend:local
    container_name: withdog-backend
    env_file:
      - ../../.env
    environment:
      # .env 의 SSH_PKEY(=~/.ssh/withdog.pem, 호스트 기준)를
      # 컨테이너 내 마운트 경로로 override. env_file 보다 environment 가 우선 적용됨.
      SSH_PKEY: /run/secrets/withdog.pem
    volumes:
      - ~/.ssh/withDOG.pem:/run/secrets/withdog.pem:ro
      - ../../data/chroma_db:/app/data/chroma_db
    # 직접 디버깅이 필요할 때 아래 주석을 해제
    # ports:
    #   - "8000:8000"
    restart: unless-stopped
    networks:
      - withdog-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── Nginx (정적 파일 서빙 + API 리버스 프록시) ─────────────────────────────
  nginx:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.nginx
    image: withdog-nginx:local
    container_name: withdog-nginx
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 444
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - withdog-net

networks:
  withdog-net:
    driver: bridge

configs:
  # NGINX_CONF 환경변수로 로컬/운영 conf 선택 (미설정 시 nginx.conf)
  # bind-mount 대신 configs 로 주입해 WSL2 9P 단일파일 마운트 이슈를 회피.
  nginx_conf:
    file: ../nginx/${NGINX_CONF:-nginx.conf}
